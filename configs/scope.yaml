# Scope resolution (scope-v1): what an event is ABOUT when no company is named.
# Deterministic vocabulary rules, not a trained model. The tiers below are measured, not asserted:
# `make scope-eval` runs the sector vocabulary on replay documents whose company DID resolve and writes the agreement with
# that company's real sector to docs/evidence/scope_eval.json. Vocabulary was written from domain knowledge BEFORE that run;
# any change after seeing the result is disclosed in docs/PROJECT_JOURNEY.md (same discipline as the pre-registered bars).
#
# Matching is on text folded by pipeline.normalize.match_form (case-folded, punctuation -> space), whole words/phrases only.
# Sectors are exactly the six of the portfolio's universe. There is no industry level: the entity master carries none.
version: "scope-v1"

sector:
  strong_min_terms: 2     # distinct terms of ONE sector, with no other sector tied, for a STRONG sector scope
  weak_allowed: true      # exactly one distinct term of one sector gives a WEAK sector scope (only after macro/market is ruled out)

# An event the trained event model calls one of these (status CLASSIFIED) is market-wide when no sector is strongly indicated.
market_categories: [MACROECONOMIC, GEOPOLITICAL]

# Everyday uses of sector words that are not the sector ("central bank" is monetary policy, not the banking sector).
# Removed before SECTOR terms are searched; themes and regions are searched on the original text.
