# Transparent hybrid severity score (hybrid-v1).
#
# WHAT THIS IS: a severity TRIAGE score on 1-10 built from explicit, inspectable factors. It says how serious this kind of development
# usually is for a financial book, given what the report says and what was knowable when it appeared. It is NOT a forecast of a price move,
# NOT a probability of loss, NOT supervised and NOT validated: no outcome labels are used anywhere in it. The trained market-reaction model
# (impact-v2) is reported next to it as a labelled reference only.
#
# WHERE THE NUMBERS COME FROM: every weight and prior below is a documented JUDGEMENT, written before looking at any result. They are
# configurable on purpose; changing one changes the score, and the UI lists the weights used. `sensitivity` shows how far the score moves if
# any single weight is off by that much, which is the honest width of "we chose these weights".
#
# TEMPORAL RULE: every factor reads only the report itself, scheduled/market information from before it, or the extraction of its text.
# Later coverage, later filings and realised moves are never read (tests/unit/test_assessment_temporal.py pins this).
version: "hybrid-v1"

# severity_points = 1 + 9 * sum_i( w_i' * f_i ) * (1 - uncertainty_discount * uncertainty),  w_i' = w_i / sum of the weights of the factors
# that are actually available (a missing factor is dropped and listed, never guessed).
weights:
  category_prior:     0.20   # how far events of this class typically reach
  severity_indicators: 0.30  # concrete markers of seriousness found in the text (the strongest, most specific signal)
  tone:               0.15   # adverse tone counts fully, favourable tone half: this is a downside-risk tool
  novelty:            0.10   # new information matters more than a restatement (only when measurable against earlier reports of the same issuer)
  breadth:            0.12   # market-wide > sector > one company
  source_credibility: 0.05   # news outlet vs social post, plus independent reports that existed at the time
  market_regime:      0.08   # the same news hits harder in a stressed market (only when market data at the report's time exists)

# How seriously each event class is taken before reading the text. 0-1.
category_prior:
  CREDIT_FUNDING: 0.75       # funding and credit events propagate through counterparties
  GEOPOLITICAL: 0.65
  MACROECONOMIC: 0.55
  REGULATORY_LEGAL: 0.55
  MARKET_VALUATION: 0.50
  MA_CORPORATE_ACTION: 0.45
  EARNINGS_FINANCIAL_PERFORMANCE: 0.45
  PRODUCT_OPERATIONS: 0.40
NO_EVENT_prior: 0.0

# Tone: adverse = max(-sentiment, 0); favourable = max(sentiment, 0) * favourable_weight. Multiplied by the extraction's tone confidence when it has one.
tone:
  favourable_weight: 0.5

# Breadth: base by what the event is about, plus a step for each extra sector / region / asset class named (capped at 1).
breadth:
  scope_base: {COMPANY: 0.25, SECTOR: 0.50, MARKET: 0.85}   # UNRESOLVED: breadth is unknown, so the factor is left out
  per_extra_item: 0.08
  items_free: 1              # the first sector / region / asset class does not add

# Source credibility: prior per source type, blended with independent reports that already existed at the report's own time.
source_credibility:
  type_prior: {NEWS: 0.7, SOCIAL: 0.35}
  type_share: 0.6            # share of the factor from the source type; the rest from corroboration at event time
  corroboration_cap: 4       # independent reports at or before the report's time that give full credit

# Market regime from the market state the trained pipeline recorded at event time (VIX level). Piecewise-linear through these points.
market_regime:
  vix_points: [[12, 0.0], [18, 0.25], [25, 0.60], [35, 1.0]]
  max_staleness_days: 5      # market state older than this (calendar days before the report) is not 'the market at the time': the factor is left out

# Uncertainty lowers the score: severity_points *= (1 - discount * uncertainty), uncertainty in [0, 1] from the extraction.
uncertainty_discount: 0.20
unknown_uncertainty: 0.50    # used when the extraction states none

# Sensitivity range: each weight scaled by (1 - delta) and (1 + delta) in turn, renormalised; the range is the min / max score over those.
sensitivity:
  delta: 0.30

# Conflicting reports: same issuer, within this window, opposite tone, both strong.
conflict:
  window_hours: 48
  min_abs_sentiment: 0.30
