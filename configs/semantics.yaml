# Semantic vocabulary (semantics-v1): the CLOSED sets the risk assessment may use, shared by the LLM extractor (which may only pick from
# them) and the deterministic rule extractor (which finds them by cue phrases).
#
# Nothing here is learned and nothing is a probability. Cues were written from domain knowledge, not tuned on outcomes. Indicator levels
# are judgement priors (see configs/severity.yaml and docs/RISK_ASSESSMENT.md): they say how serious a *kind* of development usually
# is for a financial book, never how far a price will move.
#
# Cue matching is on text folded by pipeline.normalize.match_form (case-folded, punctuation -> space), whole words/phrases only.
version: "semantics-v1"

# Sentiment label from the numeric score in [-1, 1]. Display thresholds only.
sentiment_label:
  negative_below: -0.15
  positive_above: 0.15
  intensity: {medium_from: 0.35, high_from: 0.65}   # |score|

# Asset classes an event can touch. The first four are the holdings the portfolio can contain; the rest are named for completeness and are
# never stressed (the scenario engine has no factor for them).
asset_classes: [EQUITY, BOND, LOAN, DERIVATIVE, COMMODITY, FX]

# Institutions that are named without being an issuer: kept as entities (resolved: false), never as the signal's issuer.
institutions:
  - {name: Federal Reserve, kind: INSTITUTION, region: US}
  - {name: Fed, kind: INSTITUTION, region: US}
  - {name: European Central Bank, kind: INSTITUTION, region: EU}
  - {name: ECB, kind: INSTITUTION, region: EU}
  - {name: Bank of England, kind: INSTITUTION, region: GB}
  - {name: Bank of Japan, kind: INSTITUTION, region: JP}
  - {name: People's Bank of China, kind: INSTITUTION, region: CN}
  - {name: Reserve Bank of India, kind: INSTITUTION, region: IN}
  - {name: International Monetary Fund, kind: INSTITUTION}
  - {name: IMF, kind: INSTITUTION}
  - {name: OPEC, kind: INSTITUTION, region: MIDEAST}
  - {name: SEC, kind: REGULATOR, region: US}
  - {name: Securities and Exchange Commission, kind: REGULATOR, region: US}
  - {name: Basel Committee, kind: REGULATOR}
  - {name: European Commission, kind: REGULATOR, region: EU}
  - {name: European regulators, kind: REGULATOR, region: EU}
  - {name: Department of Justice, kind: REGULATOR, region: US}
  - {name: FDIC, kind: REGULATOR, region: US}
  - {name: OCC, kind: REGULATOR, region: US}
  - {name: Treasury, kind: GOVERNMENT, region: US}

# Verbs that follow a company name at the start of a headline ("Quantum Dynamics announces ..."). Used only by the rule extractor to
# *recognise* an unresolved organisation; the name is kept only if it appears verbatim in the text.
org_verbs: [announces, announced, reports, reported, says, said, agrees, agreed, cuts, cut, raises, raised, warns, warned, plans, plan,
            launches, launched, posts, posted, expects, expected, files, filed, sues, sued, recalls, recalled, completes, completed,
            lowers, lowered, slashes, slashed, unveils, unveiled, appoints, appointed]

# Words that can open a headline and look like a company name but are not one ("Markets cut ...", "Oil prices ...").
not_organisations: [Markets, Market, Stocks, Shares, Investors, Analysts, Traders, Oil, Gold, Prices, Banks, Bonds, Yields, Wall Street,
                    Economists, Officials, Regulators, Lawmakers, Governments, Government, Companies, Firms, Europe, Asia, China,
                    Chinese, India, Japan, Russia, Ukraine, Israel, Iran, Gulf, Washington, Brussels, London, Beijing, Tokyo, Moscow]

# Severity indicators: kinds of development with a TYPICAL MATERIALITY LEVEL for a financial book. `level` is the rubric's magnitude scale
# (0 none .. 4 systemic) a development of this kind usually reaches *for one issuer*; it is the deterministic baseline of the severity rubric
# (assessment/rubric.py) and a judgement prior, not a statistic. `polarity` is who it is good or bad for: adverse | favourable | neutral
# (an event that is material but not directional, e.g. a merger). `event_class` is the taxonomy class it implies when no trained classifier or class cue
# says otherwise: finding a severity marker in a text is itself evidence that it describes a market event. `cues` find it in text (rule mode); the LLM may only choose ids from this table.
indicators:
  systemic_stress:
    label: Systemic stress
    level: 4
    polarity: adverse
    event_class: CREDIT_FUNDING
    assets: [BOND, LOAN, EQUITY, DERIVATIVE, FX]
    cues: [systemic, systemically, contagion, bank run, bank runs, run on the bank, financial crisis, credit crunch, funding markets seize, markets seize up, seize up, freeze lending, freezes lending, frozen markets, emergency liquidity, emergency rescue, emergency lending, circuit breaker, circuit breakers, breaks the buck, break the buck, clearing house defaults, market crash, stock market crash, collapse in confidence]
  default_or_insolvency:
    label: Default / insolvency
    level: 3
    polarity: adverse
    event_class: CREDIT_FUNDING
    assets: [BOND, LOAN, EQUITY]
    cues: [default, defaults, defaulted, insolvency, insolvent, bankruptcy, bankrupt, chapter 11, collapse, collapses, collapsed, missed payment, missed payments, misses a debt payment, missed a debt payment, wind down, wound down]
  liquidity_stress:
    label: Liquidity / funding stress
    level: 3
    polarity: adverse
    event_class: CREDIT_FUNDING
    assets: [BOND, LOAN]
    cues: [liquidity crunch, liquidity stress, funding stress, funding strain, margin call, margin calls, hoard cash, hoarding cash, rush to redeem, redemptions halted, funding dries up, credit lines pulled]
  sovereign_stress:
    label: Sovereign stress
    level: 3
    polarity: adverse
    event_class: CREDIT_FUNDING
    assets: [BOND, FX]
    cues: [sovereign debt crisis, fails to roll over, failed to roll over, debt restructuring, sovereign default, capital controls, currency collapse]
  supervisory_intervention:
    label: Supervisory intervention
    level: 3
    polarity: adverse
    event_class: REGULATORY_LEGAL
    assets: [EQUITY, BOND, LOAN]
    cues: [halt dividend payments, dividend ban, cease and desist, regulators step in, takes control of, receivership, nationalised, nationalized, bailout, bail-out, rescue, capital review, placed under administration]
  armed_conflict:
    label: Armed conflict / escalation
    level: 3
    polarity: adverse
    event_class: GEOPOLITICAL
    assets: [EQUITY, COMMODITY, FX]
    cues: [escalation, military strike, invasion, airstrike, missile, missile fire, armed conflict, military conflict, hostilities, war, conflict erupts, ceasefire collapse]
  supply_disruption:
    label: Supply disruption
    level: 3
    polarity: adverse
    event_class: GEOPOLITICAL
    assets: [COMMODITY, EQUITY]
    cues: [blockade, supply routes, supply route, supply disruption, supply chain disruption, shipping disruption, pipeline outage, supply shortage, strait]
  market_selloff:
    label: Market sell-off
    level: 2
    polarity: adverse
    event_class: MARKET_VALUATION
    assets: [EQUITY, DERIVATIVE]
    cues: [sell-off, selloff, plunge, plunges, plummets, tumble, tumbles, rout, volatility spike]
  rating_downgrade:
    label: Rating downgrade
    level: 2
    polarity: adverse
    event_class: CREDIT_FUNDING
    assets: [BOND, LOAN, EQUITY]
    cues: [downgrade, downgrades, downgraded, cut to junk, to junk, junk status]
  funding_cost_increase:
    label: Higher funding costs
    level: 2
    polarity: adverse
    event_class: CREDIT_FUNDING
    assets: [BOND, LOAN]
    cues: [funding costs, higher borrowing costs, borrowing costs, cost of funding, cost of capital, widening spreads, spreads widen, yields spike]
  capital_requirement_change:
    label: Capital requirement change
    level: 2
    polarity: adverse
    event_class: REGULATORY_LEGAL
    assets: [EQUITY, BOND, LOAN]
    cues: [capital requirements, capital requirement, capital rules, capital buffer, capital buffers, capital ratio, leverage ratio, basel, stress capital buffer, hold more capital]
  policy_tightening:
    label: Monetary tightening
    level: 2
    polarity: adverse
    event_class: MACROECONOMIC
    assets: [BOND, EQUITY, DERIVATIVE]
    cues: [raises its policy rate, raises policy rate, rate hike, rate hikes, raises interest rates, higher for longer, remain elevated, rates elevated, tightening]
  inflation_persistence:
    label: Persistent inflation
    level: 2
    polarity: adverse
    event_class: MACROECONOMIC
    assets: [BOND, EQUITY]
    cues: [inflation remains, persistent inflation, inflation persistent, sticky inflation, inflation surprise, hotter than expected, inflation pressure, inflation pressures]
  sanctions_trade_restriction:
    label: Sanctions / trade restriction
    level: 2
    polarity: adverse
    event_class: GEOPOLITICAL
    assets: [EQUITY, COMMODITY, FX]
    cues: [sanctions, sanctioned, embargo, export ban, export controls, tariff, tariffs, trade restrictions, trade war]
  commodity_price_spike:
    label: Commodity price spike
    level: 2
    polarity: adverse
    event_class: MARKET_VALUATION
    assets: [COMMODITY, EQUITY, DERIVATIVE]
    cues: [crude prices, oil prices surge, prices sharply higher, price spike, soars, surges, natural gas prices]
  cyber_incident:
    label: Cyber incident
    level: 2
    polarity: adverse
    event_class: PRODUCT_OPERATIONS
    assets: [EQUITY]
    cues: [cyberattack, cyber attack, ransomware, data breach, hacked]
  guidance_cut:
    label: Guidance cut / earnings miss
    level: 2
    polarity: adverse
    event_class: EARNINGS_FINANCIAL_PERFORMANCE
    assets: [EQUITY]
    cues: [cuts revenue outlook, cuts its revenue outlook, cuts outlook, lowers guidance, lowers its guidance, lowered guidance, cuts guidance, cuts full-year, cuts forecast, slashes forecast, revenue forecast, profit warning, weaker demand, weaker than expected, weaker-than-expected, misses estimates, earnings miss, suspends its buyback, suspends buyback, profit hit]
  restructuring:
    label: Restructuring / job cuts
    level: 2
    polarity: adverse
    event_class: MA_CORPORATE_ACTION
    assets: [EQUITY, BOND]
    cues: [restructuring, restructure, layoffs, job cuts, cut jobs, close stores, closes stores, spin off, spin-off, divestiture, write down, write-down, impairment, reserve charge, takes a charge]
  trial_or_approval_failure:
    label: Trial / approval failure
    level: 2
    polarity: adverse
    event_class: PRODUCT_OPERATIONS
    assets: [EQUITY]
    cues: [trial fails, trial failed, late-stage trial, rejects approval, complete response letter, approval denied]
  litigation_loss:
    label: Litigation / legal loss
    level: 2
    polarity: adverse
    event_class: REGULATORY_LEGAL
    assets: [EQUITY]
    cues: [rules against, landmark ruling, landmark case, antitrust lawsuit, damages of]
  new_regulation:
    label: New regulation / legislation
    level: 2
    polarity: adverse
    event_class: REGULATORY_LEGAL
    assets: [EQUITY, BOND, LOAN]
    cues: [new rules, finalize rules, finalizes rules, passes a law, passes law, caps the, cap on, ban on, bans, ordered to, mandates, legislation]
  outlook_negative:
    label: Negative rating outlook
    level: 1
    polarity: adverse
    event_class: CREDIT_FUNDING
    assets: [BOND]
    cues: [outlook negative, negative outlook, outlook to negative, outlook revised to negative, on watch negative, credit watch]
  regulatory_enforcement:
    label: Enforcement / fine
    level: 1
    polarity: adverse
    event_class: REGULATORY_LEGAL
    assets: [EQUITY]
    cues: [fined, fine of, penalty, penalties, enforcement action, consent order, probe, investigation, subpoena, charged]
  litigation:
    label: Litigation
    level: 1
    polarity: adverse
    event_class: REGULATORY_LEGAL
    assets: [EQUITY]
    cues: [lawsuit, sued, sues, class action, antitrust, court ruled, jury, settlement]
  operational_failure:
    label: Operational failure
    level: 1
    polarity: adverse
    event_class: PRODUCT_OPERATIONS
    assets: [EQUITY]
    cues: [outage, recall, recalls, recalled, explosion, halted production, service disruption, disruption]
  geopolitical_tension:
    label: Geopolitical tension
    level: 1
    polarity: adverse
    event_class: GEOPOLITICAL
    assets: [EQUITY, COMMODITY, FX]
    cues: [escalating tensions, rising tensions, tensions escalate, geopolitical tensions, heightened tensions, raises tensions, border skirmish, skirmish, standoff, diplomatic row]
  large_transaction:
    label: Large transaction
    level: 2
    polarity: neutral
    event_class: MA_CORPORATE_ACTION
    assets: [EQUITY, BOND]
    cues: [multibillion, multi-billion, billion transaction, billion deal, billion acquisition, takeover, hostile bid, agrees to acquire, agrees to buy, to acquire, merger]
  earnings_beat:
    label: Earnings / guidance beat
    level: 1
    polarity: favourable
    event_class: EARNINGS_FINANCIAL_PERFORMANCE
    assets: [EQUITY]
    cues: [beats estimates, raises guidance, raises full-year guidance, raises its dividend, record profit, strong demand, raises forecast, upbeat outlook]
  rating_upgrade:
    label: Rating upgrade
    level: 1
    polarity: favourable
    event_class: CREDIT_FUNDING
    assets: [BOND, EQUITY]
    cues: [upgrade, upgrades, upgraded, outlook positive, positive outlook]
  policy_easing:
    label: Monetary / fiscal easing
    level: 2
    polarity: favourable
    event_class: MACROECONOMIC
    assets: [BOND, EQUITY, DERIVATIVE]
    cues: [cuts its policy rate, cuts policy rate, rate cut, rate cuts, cuts interest rates, stimulus package, stimulus, quantitative easing, lowers rates]
  trade_liberalisation:
    label: Trade liberalisation
    level: 2
    polarity: favourable
    event_class: MACROECONOMIC
    assets: [EQUITY, COMMODITY, FX]
    cues: [lowering tariffs, removes tariffs, removing tariffs, tariff cuts, trade agreement, trade deal, free trade]

# Words that change the SCALE of whatever happened, regardless of which indicator it is. Applied deterministically in the rules baseline: one step
# up (at most one in total) for escalators, one step down (at most one) for de-escalators. They never create an event by themselves.
scale_up:
  [in decades, in a generation, since the financial crisis, steepest, largest increase, largest rise, largest in decades, largest in a decade, biggest since, highest since, lowest since, record, unprecedented, historic, sweeping, wide-ranging, nuclear, emergency, sharply]
scale_down:
  [minor, small, slight, slightly, modest, marginal, routine, in line with expectations, in line with the previous, as expected, reaffirms, reaffirmed, reiterates, affirms, unchanged, brief, briefly, no change, no impact, local, limited]

# Where an event reaches. The broadest level a cue supports (a named company or nothing = firm). Sector comes from the sector vocabulary
# (configs/scope.yaml, plural / sector-wide terms only: "a retailer" is one firm, "retailers" is a sector).
reach:
  global_cues: [global markets, global market, global economy, global financial, global equity, global equities, global stocks, global sell-off, global recession, worldwide, globally, world markets, international markets, around the world, across several countries, across countries, coordinated]
  market_cues: [markets, market-wide, stock market, stock markets, equity futures, bond market, bond markets, interbank, banking system, financial system, economy, economies, central bank, central banks, policy rate, interest rates, yields, clearing house, money market, commercial paper, funding markets, sovereign, trade route, shipping lanes, currency]
  generic_firm_pattern: '^(?:(?:a|an|the)\s+)?(?:(?:large|major|mid-sized|small|regional|global|leading|biggest|largest|listed|us|u\.s\.)\s+)*(?:[a-z-]+\s+){0,2}(?:company|firm|bank|lender|retailer|insurer|maker|producer|manufacturer|developer|carrier|operator|fund|group|brand|utility|chipmaker|drugmaker|automaker|airline|provider|refinery|hedge fund|lender)\b'

# Whether the event has happened. First match wins, in this order.
certainty:
  speculative_cues: [rumour, rumours, rumoured, reportedly, sources say, sources said, in talks, talks to, could, may, might, possible, potentially, considering, weighs, mulls, exploring, speculation, fears of]
  proposed_cues: [propose, proposes, proposed, proposal, plans to, planning to, draft, seeks to, would, consultation, expected to, set to, to be announced, pending]

# A monetary amount is a plain, checkable proxy for scale: the largest "$N million|billion|trillion" figure in the text sets a FLOOR under the rules
# baseline magnitude (it never lowers it).
amount_floor:
  - {min_usd: 1.0e9, level: 2}
  - {min_usd: 1.0e11, level: 3}

# Event subtypes under each of the eight taxonomy classes. A subtype is a finer reading of the SAME class, never a new class. Rule mode picks
# the subtype with the most distinct cue hits; the LLM may only choose one of these ids (or `other`).
subtypes:
  GEOPOLITICAL:
    - {id: armed_conflict, label: Armed conflict, cues: [war, invasion, military, missile, airstrike, escalating tensions, escalation, conflict]}
    - {id: sanctions_trade, label: Sanctions / trade measures, cues: [sanctions, embargo, tariff, tariffs, export controls, trade war]}
    - {id: supply_route_disruption, label: Supply-route disruption, cues: [supply routes, supply route, strait, blockade, shipping, pipeline, oil supply]}
    - {id: political_instability, label: Political instability, cues: [coup, election, unrest, protests, government collapse]}
  MACROECONOMIC:
    - {id: monetary_policy, label: Monetary policy, cues: [federal reserve, fed, central bank, interest rates, rate hike, rate cut, ecb, policy rate]}
    - {id: inflation, label: Inflation, cues: [inflation, cpi, consumer prices, price pressures]}
    - {id: growth_labour, label: Growth / labour data, cues: [gdp, payrolls, unemployment, jobs report, recession, pmi]}
  CREDIT_FUNDING:
    - {id: rating_action, label: Rating action, cues: [downgrade, downgraded, upgrade, rating agency, outlook negative]}
    - {id: liquidity_funding, label: Liquidity / funding, cues: [liquidity, funding, refinancing, bank run, credit crunch, margin call]}
    - {id: default_distress, label: Default / distress, cues: [default, bankruptcy, insolvency, distressed, missed payment]}
  MA_CORPORATE_ACTION:
    - {id: acquisition, label: Acquisition / merger, cues: [acquire, acquisition, merger, takeover, buyout, to buy]}
    - {id: restructuring_divestiture, label: Restructuring / divestiture, cues: [restructuring, divestiture, spin off, spin-off, layoffs, job cuts, write down]}
    - {id: capital_return, label: Buy-back / dividend, cues: [buyback, buy-back, dividend, share repurchase]}
  REGULATORY_LEGAL:
    - {id: capital_requirements, label: Capital requirements, cues: [capital requirements, capital rules, capital buffer, basel, leverage ratio, stress test]}
    - {id: enforcement_fine, label: Enforcement / fine, cues: [fined, fine, penalty, enforcement, probe, investigation, consent order]}
    - {id: litigation, label: Litigation, cues: [lawsuit, sued, court, ruling, antitrust, class action, settlement]}
    - {id: new_rules, label: New rules / legislation, cues: [regulators propose, new rules, legislation, bill, ban, rule proposal, proposed rule]}
  PRODUCT_OPERATIONS:
    - {id: product_launch, label: Product launch, cues: [launch, launches, unveils, introduces, new product]}
    - {id: recall_outage, label: Recall / outage, cues: [recall, outage, defect, cyberattack, data breach, halted production]}
    - {id: trial_result, label: Trial / test result, cues: [trial, phase 3, fda, approval, test results]}
  EARNINGS_FINANCIAL_PERFORMANCE:
    - {id: guidance_change, label: Guidance change, cues: [outlook, guidance, forecast, cuts, raises, lowers]}
    - {id: results_surprise, label: Results surprise, cues: [earnings, results, profit, revenue, beats, misses, quarter]}
  MARKET_VALUATION:
    - {id: selloff_rally, label: Sell-off / rally, cues: [sell-off, selloff, rally, plunge, surge, tumble, rout]}
    - {id: volatility, label: Volatility regime, cues: [volatility, vix, swings, turbulence]}
    - {id: valuation_call, label: Valuation call, cues: [overvalued, undervalued, bubble, price target, valuation]}
