# Sentiment model v2 (candidate). Same data, features and calibration as v1; what changes is the selection rule and the grid.
#
# WHY (disclosed, not blind): v1 was selected by calibrated valid log-loss and the winner was the unweighted model, which defaults
# to neutral out of domain (negative recall 0.19 on the gold set, 0.28 on PhraseBank; docs/SENTIMENT_MODEL.md). The audit probe with
# class_weight=balanced beat it out of domain. This rule was therefore chosen AFTER seeing those results; it is not a pre-registered
# test. What keeps it honest: it is fixed here before v2 is trained, it ranks on TFN validation only, and PhraseBank, the gold sets
# and the TFN test split take no part in selection. v1 stays in the repo as the reference and the fall-back.
version: "tfidf-lr-v2"
model_dir: models/sentiment/tfidf-lr-v2
table: data/modeling/sentiment.jsonl
seed: 20261004

word: {ngram_range: [1, 2], min_df: 2}
char: {ngram_range: [2, 5], min_df: 3}
max_iter: 1000

grid:
  preprocessing: [raw, normalised]
  C: [0.3, 1, 3, 10]
  class_weight: [balanced]      # the point of v2: no neutral prior
# Winner = highest TFN-validation macro-F1 of the argmax (the three classes are imbalanced, accuracy would reward neutral).
# The temperature is still fitted on valid log-loss afterwards, so probabilities stay calibrated.
selection_rule: valid_macro_f1
temperature_grid: [0.5, 4.0, 0.01]

evaluation:
  ece_bins: 10
  bootstrap_resamples: 1000
  bootstrap_seed: 7
  lexicon_threshold: 0.12
  product_threshold: 0.15
  confident_errors: 12
  near_duplicate_threshold: 0.7
