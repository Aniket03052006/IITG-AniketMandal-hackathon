# Sentiment model (the first real NLP stage). Everything that decides what the model is lives here, not in code;
# values are validated at startup, a typo fails loudly. Changing training-relevant values changes the artifact: bump `version`.
version: "tfidf-lr-v1"
model_dir: models/sentiment/tfidf-lr-v1   # model.joblib + model_card.json (committed; the API refuses to start without them)
table: data/modeling/sentiment.jsonl      # TFN sentiment, exact-deduplicated, near-duplicate-grouped, re-split (make audit)
seed: 20261004

# Features: word 1-2 grams + character 2-5 grams (robust to cashtags, typos and tweet shorthand), both sublinear TF-IDF.
word: {ngram_range: [1, 2], min_df: 2}
char: {ngram_range: [2, 5], min_df: 3}
max_iter: 1000

# Candidates are fitted on train and ranked on valid only. Test, PhraseBank and the gold set take no part in selection.
grid:
  preprocessing: [raw, normalised]   # normalised: URLs/@handles dropped, $TICKER and numbers become tokens
  C: [0.3, 1, 3, 10]
  class_weight: [balanced, null]
# The product consumes calibrated probabilities (score = p_pos - p_neg), so the winner is the lowest valid log-loss
# after a one-parameter temperature fit, not the highest macro-F1. Macro-F1 is reported next to it.
selection_rule: valid_log_loss_after_temperature
temperature_grid: [0.5, 4.0, 0.01]

evaluation:
  ece_bins: 10
  bootstrap_resamples: 1000
  bootstrap_seed: 7
  lexicon_threshold: 0.12      # placeholder-lexicon baseline: score cut, as in modeling.probe
  product_threshold: 0.15      # the UI's Negative/Positive cut; the product's label rule is score <= -t / >= t
  confident_errors: 12
  near_duplicate_threshold: 0.7
