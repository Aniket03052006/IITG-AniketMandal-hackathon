[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eventshock"
version = "0.1.0"
description = "Event-driven financial risk intelligence and portfolio stress-testing engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Aniket Mandal" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
  "numpy>=2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2", "ruff>=0.6"]
# kept for compatibility: numpy and scikit-learn are now runtime dependencies (the sentiment model)
ml = []

[project.scripts]
eventshock = "eventshock.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eventshock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]
"experiments/**" = ["E501"]
# Stage-2 data-pipeline modules keep dense, table-like argument lists; line length is not enforced there.
"src/eventshock/pipeline/*.py" = ["E501"]
# Stage 6 modules carry long explanatory docstrings and field descriptions (the API contract text), like the pipeline modules.
"src/eventshock/domain/scope.py" = ["E501"]
"src/eventshock/services/analyze.py" = ["E501"]
"src/eventshock/services/live.py" = ["E501"]
"src/eventshock/services/relevance.py" = ["E501"]
"src/eventshock/api/routers/analyze.py" = ["E501"]
"src/eventshock/api/routers/live.py" = ["E501"]
"src/eventshock/api/routers/scope.py" = ["E501"]
"src/eventshock/api/routers/portfolios.py" = ["E501"]
"src/eventshock/api/routers/portfolio.py" = ["E501"]
"src/eventshock/api/routers/stress.py" = ["E501"]
"src/eventshock/portfolio/*.py" = ["E501"]
"src/eventshock/api/routers/signals.py" = ["E501"]
"src/eventshock/api/routers/meta.py" = ["E501"]
"src/eventshock/api/routers/scenarios.py" = ["E501"]
"src/eventshock/api/routers/evidence.py" = ["E501"]
"src/eventshock/api/schemas.py" = ["E501"]
"src/eventshock/api/deps.py" = ["E501"]
"src/eventshock/services/stress_service.py" = ["E501"]
"src/eventshock/store.py" = ["E501"]
# Stage 7 (risk assessment, LLM adapter): dense schemas, vocabulary tables and explanatory field descriptions, like the pipeline modules.
"src/eventshock/assessment/*.py" = ["E501"]
"src/eventshock/llm/*.py" = ["E501"]
"src/eventshock/config.py" = ["E501"]
"src/eventshock/domain/provenance.py" = ["E501"]
"src/eventshock/domain/signals.py" = ["E501"]
"src/eventshock/domain/stress.py" = ["E501"]
# Stage 8 (historical analogues): explanatory docstrings and evidence-record literals, like the other evidence modules.
"src/eventshock/retrieval/*.py" = ["E501"]
"src/eventshock/stress/history_check.py" = ["E501"]
"src/eventshock/services/analogues.py" = ["E501"]
"src/eventshock/services/outcome_check.py" = ["E501"]
"src/eventshock/ingestion/*.py" = ["E501"]
"src/eventshock/modeling/*.py" = ["E501"]
"src/eventshock/modeling/representations/*.py" = ["E501"]
"src/eventshock/services/evidence.py" = ["E501"]
"src/eventshock/services/signal_context.py" = ["E501"]
"tests/**" = ["E501"]
